# Mr.Chase posts the alerts of every Always Chasing project to #alerts,
# through its incoming webhook. It holds no other permission: Slack requires
# a bot user to grant the webhook, but the bot cannot post or read anything.
_metadata:
  major_version: 2
  minor_version: 1
display_information:
  name: Mr.Chase
  description: "Posts the deploy notices and production alerts of every Always Chasing project to #alerts."
  background_color: "#06080a"
features:
  bot_user:
    display_name: mr-chase
    always_online: false
oauth_config:
  scopes:
    bot:
      - incoming-webhook
settings:
  incoming_webhooks:
    incoming_webhooks_enabled: true
  org_deploy_enabled: false
  socket_mode_enabled: false
  token_rotation_enabled: false
