# Mr.Chase, the Slack app every Always Chasing project posts its alerts
# through: the same name as Always Chasing's agent in Linear, so Always Chasing
# has one identity across its tools. Created once in the «Always Chasing»
# workspace and installed to #alerts. It holds no
# permission beyond its incoming webhook: Slack asks for a bot user to grant
# that one («Oauth requires bot_user»), but the bot cannot post or read
# anything on its own, and its token is kept nowhere. The README says how to
# create it and where its webhook goes.
_metadata:
  major_version: 2
  minor_version: 1
display_information:
  name: Mr.Chase
  description: "Posts the deploy notices and production alerts of every Always Chasing project to #alerts."
  background_color: "#06080a"
features:
  bot_user:
    display_name: mr-chase
    always_online: false
oauth_config:
  scopes:
    bot:
      - incoming-webhook
settings:
  incoming_webhooks:
    incoming_webhooks_enabled: true
  org_deploy_enabled: false
  socket_mode_enabled: false
  token_rotation_enabled: false
