# Every pull request and every push to main: the types and the tests of both
# actions, and the security of the workflows and of the actions themselves.
#
# To edit it: actions pinned to a full commit SHA with the version beside it,
# no secrets, and no permission beyond reading the repo.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

jobs:
  check:
    name: Check
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check

  security:
    name: Security
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Workflow and action security
        uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
        with:
          version: 1.30.1
          # The findings go on the diff; Advanced Security is not part of the plan.
          advanced-security: false
          annotations: true
